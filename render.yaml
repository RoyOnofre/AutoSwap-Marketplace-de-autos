# render.yaml – defines both the FastAPI backend and the Vite/React static site

services:
  # ---------- Backend ----------
  - type: web
    name: AutoSwap-Marketplace-de-Autos
    env: python
    plan: free
    buildCommand: pip install python-dotenv && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_DATABASE_URL
        value: postgresql+psycopg2://postgres.eiwmwozjuranqqniwrp:5jwyfwos0209@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false

  # ---------- Frontend ----------
  - type: web
    name: autoswap-frontend
    env: static
    buildCommand: bash build-all.sh
    staticPublishPath: landing/out
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_MERCADO_PAGO_PUBLIC_KEY
        sync: false 