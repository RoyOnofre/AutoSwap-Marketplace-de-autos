# render.yaml – defines both the FastAPI backend and the Vite/React static site

services:
  # ---------- Backend ----------
  - type: web
    name: AutoSwap-Marketplace-de-Autos
    env: python
    plan: free
    # Instalamos python-dotenv explícitamente antes de los requerimientos
    buildCommand: pip install python-dotenv && pip install -r backend/requirements.txt
    # Dejamos que Uvicorn escuche el puerto dinámico que le asigne Render
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # ---------- Frontend ----------
  - type: web
    name: autoswap-frontend
    env: static
    buildCommand: bash build-all.sh
    staticPublishPath: landing/out
    envVars:
      - key: VITE_API_URL
        sync: false